```html
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Carrinho</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Carrinho</h1>
    <a href="index.html">Voltar</a>
</header>

<ul id="lista"></ul>

<h2 id="total"></h2>

<h3>Forma de Pagamento</h3>

<div class="pagamento-box">
    <h3>💳 Forma de Pagamento</h3>

    <select id="pagamento">
        <option value="">Selecione</option>
        <option value="PIX">PIX</option>
        <option value="Cartão">Cartão</option>
        <option value="Boleto">Boleto</option>
    </select>
</div>

<button class="finalizar-btn" onclick="finalizarCompra()">
    Finalizar Compra
</button>

<script>
let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

function render(){
    let lista = document.getElementById("lista");
    lista.innerHTML = "";

    let total = 0;

    carrinho.forEach((item,i)=>{

        // evita erro com itens antigos
        if(!item.qtd) item.qtd = 1;
        if(!item.tamanho) item.tamanho = "";

        let li = document.createElement("li");

        li.innerHTML = `
        <strong>${item.nome}</strong>

        <div>
            <button onclick="menos(${i})">-</button>
            ${item.qtd}
            <button onclick="mais(${i})">+</button>
        </div>

        <!-- TAMANHO -->
        <select onchange="mudarTamanho(${i}, this.value)">
            <option value="">Tamanho</option>
            <option ${item.tamanho=="P"?"selected":""}>P</option>
            <option ${item.tamanho=="M"?"selected":""}>M</option>
            <option ${item.tamanho=="G"?"selected":""}>G</option>
            <option ${item.tamanho=="GG"?"selected":""}>GG</option>
            <option ${item.tamanho=="34"?"selected":""}>34</option>
            <option ${item.tamanho=="35"?"selected":""}>35</option>
            <option ${item.tamanho=="36"?"selected":""}>36</option>
            <option ${item.tamanho=="37"?"selected":""}>37</option>
            <option ${item.tamanho=="38"?"selected":""}>38</option>
            <option ${item.tamanho=="39"?"selected":""}>39</option>
            <option ${item.tamanho=="40"?"selected":""}>40</option>
            <option ${item.tamanho=="41"?"selected":""}>41</option>
            <option ${item.tamanho=="42"?"selected":""}>42</option>
            <option ${item.tamanho=="43"?"selected":""}>43</option>
            <option ${item.tamanho=="44"?"selected":""}>44</option>
            <option ${item.tamanho=="45"?"selected":""}>45</option>
        </select>

        <br>

        R$ ${(item.preco * item.qtd).toFixed(2)}

        <button onclick="remover(${i})">❌</button>
        `;

        lista.appendChild(li);

        total += item.preco * item.qtd;
    });

    document.getElementById("total").innerText =
        "Total: R$ " + total.toFixed(2);
}

function mudarTamanho(i, valor){
    carrinho[i].tamanho = valor;
    salvar();
}

function mais(i){
    carrinho[i].qtd++;
    salvar();
}

function menos(i){
    if(carrinho[i].qtd > 1){
        carrinho[i].qtd--;
    } else {
        carrinho.splice(i,1);
    }
    salvar();
}

function remover(i){
    carrinho.splice(i,1);
    salvar();
}

function salvar(){
    localStorage.setItem("carrinho", JSON.stringify(carrinho));
    render();
}

function finalizarCompra(){
    let pagamento = document.getElementById("pagamento").value;

    if(pagamento === ""){
        alert("Escolha uma forma de pagamento!");
        return;
    }

    alert("Compra finalizada com " + pagamento + " 🎉");

    carrinho = [];
    salvar();
}

render();
</script>

<div id="mensagem-compra"></div>

</body>
</html>
