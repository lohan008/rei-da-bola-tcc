<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Carrinho - Rei da Bola</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Carrinho</h1>
    <a href="index.html">Voltar</a>
</header>

<ul id="lista"></ul>

<h2 id="total"></h2>

<button class="finalizar-btn" onclick="finalizarCompra()">
    Finalizar Compra
</button>

<script>

let carrinho =
    JSON.parse(localStorage.getItem("carrinho")) || [];


/* ========================================
   MOSTRAR CARRINHO
   ======================================== */

function render(){

    let lista =
        document.getElementById("lista");

    lista.innerHTML = "";

    let total = 0;


    carrinho.forEach((item, i) => {

        /* Evita erro com itens antigos */

        if(!item.qtd)
            item.qtd = 1;

        if(!item.tamanho)
            item.tamanho = "";


        let li =
            document.createElement("li");


        li.innerHTML = `

            <img
                src="${item.imagem}"
                width="90"
            >

            <br>

            <strong>
                ${item.nome}
            </strong>


            <div>

                <button
                    onclick="menos(${i})"
                >
                    -
                </button>

                ${item.qtd}

                <button
                    onclick="mais(${i})"
                >
                    +
                </button>

            </div>


            <!-- TAMANHO -->

            <select
                onchange="mudarTamanho(${i}, this.value)"
            >

                <option value="">
                    Tamanho
                </option>

                <option
                    ${item.tamanho=="P"?"selected":""}
                >
                    P
                </option>

                <option
                    ${item.tamanho=="M"?"selected":""}
                >
                    M
                </option>

                <option
                    ${item.tamanho=="G"?"selected":""}
                >
                    G
                </option>

                <option
                    ${item.tamanho=="GG"?"selected":""}
                >
                    GG
                </option>


                <option
                    ${item.tamanho=="34"?"selected":""}
                >
                    34
                </option>

                <option
                    ${item.tamanho=="35"?"selected":""}
                >
                    35
                </option>

                <option
                    ${item.tamanho=="36"?"selected":""}
                >
                    36
                </option>

                <option
                    ${item.tamanho=="37"?"selected":""}
                >
                    37
                </option>

                <option
                    ${item.tamanho=="38"?"selected":""}
                >
                    38
                </option>

                <option
                    ${item.tamanho=="39"?"selected":""}
                >
                    39
                </option>

                <option
                    ${item.tamanho=="40"?"selected":""}
                >
                    40
                </option>

                <option
                    ${item.tamanho=="41"?"selected":""}
                >
                    41
                </option>

                <option
                    ${item.tamanho=="42"?"selected":""}
                >
                    42
                </option>

                <option
                    ${item.tamanho=="43"?"selected":""}
                >
                    43
                </option>

                <option
                    ${item.tamanho=="44"?"selected":""}
                >
                    44
                </option>

                <option
                    ${item.tamanho=="45"?"selected":""}
                >
                    45
                </option>

            </select>


            <br>


            R$
            ${(item.preco * item.qtd)
                .toFixed(2)
                .replace(".", ",")
            }


            <button
                onclick="remover(${i})"
            >
                ❌
            </button>

        `;


        lista.appendChild(li);


        total +=
            item.preco * item.qtd;

    });


    document
        .getElementById("total")
        .innerText =
            "Total: R$ " +
            total
                .toFixed(2)
                .replace(".", ",");

}


/* ========================================
   ALTERAR TAMANHO
   ======================================== */

function mudarTamanho(i, valor){

    carrinho[i].tamanho =
        valor;

    salvar();

}


/* ========================================
   AUMENTAR QUANTIDADE
   ======================================== */

function mais(i){

    carrinho[i].qtd++;

    salvar();

}


/* ========================================
   DIMINUIR QUANTIDADE
   ======================================== */

function menos(i){

    if(carrinho[i].qtd > 1){

        carrinho[i].qtd--;

    } else {

        carrinho.splice(i,1);

    }

    salvar();

}


/* ========================================
   REMOVER PRODUTO
   ======================================== */

function remover(i){

    carrinho.splice(i,1);

    salvar();

}


/* ========================================
   SALVAR CARRINHO
   ======================================== */

function salvar(){

    localStorage.setItem(
        "carrinho",
        JSON.stringify(carrinho)
    );

    render();

}


/* ========================================
   FINALIZAR COMPRA
   ======================================== */

function finalizarCompra(){

    let carrinhoAtual =
        JSON.parse(
            localStorage.getItem("carrinho")
        ) || [];


    if(carrinhoAtual.length === 0){

        alert(
            "Seu carrinho está vazio!"
        );

        return;

    }


    window.location.href =
        "checkout.html";

}


render();

</script>

</body>
</html>
