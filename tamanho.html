<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Escolher Tamanho</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Escolha o Tamanho</h1>
    <a href="index.html">Voltar</a>
</header>

<div class="box-tamanho">
    <h2 id="nomeProduto"></h2>

    <select id="tamanho">
        <option value="">Selecione</option>
        <option>P</option>
        <option>M</option>
        <option>G</option>
        <option>GG</option>
        <option>34</option>
        <option>35</option>
        <option>36</option>
        <option>37</option>
        <option>38</option>
        <option>39</option>
        <option>40</option>
        <option>41</option>
        <option>42</option>
        <option>43</option>
        <option>44</option>
        <option>45</option>
    </select>

    <br><br>

    <button onclick="confirmar()">Confirmar</button>
</div>

<script>
let produto = JSON.parse(localStorage.getItem("produtoTemp"));

document.getElementById("nomeProduto").innerText = produto.nome;

function confirmar(){
    let tamanho = document.getElementById("tamanho").value;

    if(tamanho === ""){
        alert("Escolha um tamanho!");
        return;
    }

    let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

    carrinho.push({
        nome: produto.nome,
        preco: produto.preco,
        imagem: produto.imagem,
        qtd:1,
        tamanho: tamanho
    });

    localStorage.setItem("carrinho", JSON.stringify(carrinho));

    window.location.href = "carrinho.html";
}
</script>

</body>
</html>
